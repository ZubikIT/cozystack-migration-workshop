apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app
  namespace: tenant-pXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # из convert.sh (строка Share:)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app
  namespace: tenant-pXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app
  external: true
  externalMethod: PortList
  externalPorts:
    - 22
    - 8080
